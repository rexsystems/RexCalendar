name: RexCalendar
version: '${project.version}'
main: me.rexsystems.rexCalendar.RexCalendar
api-version: '1.21'
folia-supported: true
authors: [RexSystems]
description: Advent calendar rewards for Paper servers
website: https://rexsystems.me
softdepend: [PlaceholderAPI]

commands:
  rexcalendar:
    description: Open the calendar, reload, or show help
    aliases: [rcal, rcalendar]
    usage: /rexcalendar <open|reload|help>

permissions:
  rexcalendar.use:
    description: Open the calendar and claim a day
    default: true
  rexcalendar.reload:
    description: Reload RexCalendar
    default: op
  rexcalendar.admin:
    description: Claim a missed day and skip the IP limit
    default: op
  rexcalendar.day.*:
    description: Claim every calendar day
    default: true
    children:
      rexcalendar.day.1: true
      rexcalendar.day.2: true
      rexcalendar.day.3: true
      rexcalendar.day.4: true
