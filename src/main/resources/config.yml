messages:
  prefix: "<gray>[<#f75634>RexCalendar<gray>] "
  no-permission: "{prefix}<red>You do not have permission to do that."
  reload: "{prefix}<green>Configuration reloaded."
  claim: "{prefix}<green>You claimed day {day}."
  already-claimed: "{prefix}<red>You already claimed day {day}."
  too-early: "{prefix}<red>Day {day} is not open yet."
  missed: "{prefix}<red>Day {day} has passed."
  ip-limit: "{prefix}<red>Too many accounts have claimed day {day} from your network."
  no-reward: "{prefix}<gray>Day {day} had nothing this time."
  inventory-full: "{prefix}<red>Your inventory is full. Day {day} was not claimed."
  claim-failed: "{prefix}<red>The reward could not be given. Day {day} was not claimed."
  world: "{prefix}<red>The calendar is closed in this world."
  players-only: "{prefix}<red>Only players can do that."
  help-header: "{prefix}<white>RexCalendar"
  help:
    - "<gray>/rexcalendar open <dark_gray>- <white>Open the calendar"
    - "<gray>/rexcalendar reload <dark_gray>- <white>Reload the configuration"
    - "<gray>/rexcalendar help <dark_gray>- <white>Show this help"

storage:
  # sqlite or mysql. sqlite writes plugins/RexCalendar/calendar.db.
  # Reload reads config.yml and leaves claims in place. It does not reconnect storage.
  type: sqlite
  mysql:
    host: 127.0.0.1
    port: 3306
    database: rexcalendar
    username: calendar
    password: ""
    # Clamped to 1-20.
    pool-size: 4
    ssl: false
