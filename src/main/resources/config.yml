# RexCalendar configuration
# Messages, titles, item names, and lore accept MiniMessage, legacy & codes, &#RRGGBB, and #RRGGBB.
# A broken MiniMessage line falls back to legacy codes.
# {player} is inserted as plain text. Color belongs in the template.
# Tokens: {player} {uuid} {day} {date} {page} {prefix} {status}

config-version: 1

settings:
  # ZoneId. The current day is read when a player opens or claims, so midnight needs no restart.
  # Reload after you change this string. Example: Europe/Bucharest, UTC, America/New_York.
  timezone: Europe/Bucharest
  # today-only: the door for today's date. claim-past: today and earlier doors this month.
  # A future door stays closed. rexcalendar.admin can claim a missed door.
  missed-days: today-only
  # 0 stores no address hash and applies no limit.
  # A positive number is how many different accounts may claim that date for one address hash.
  ip-limit: 0

worlds:
  # If this list is not empty, the calendar opens only in these worlds.
  enabled: []
  disabled: []

sounds:
  enabled: true
  # Bukkit sound name, for example ENTITY_PLAYER_LEVELUP. Empty skips the sound.
  sound: ENTITY_PLAYER_LEVELUP
  volume: 1.0
  pitch: 1.0

title:
  enabled: true
  # Times are ticks. 20 ticks is one second. Each value is clamped to 0-1200.
  text: "<gold>Day {day}"
  subtitle: "<gray>Claimed"
  fade-in: 10
  stay: 40
  fade-out: 10

actionbar:
  enabled: true
  text: "<green>Day {day} claimed"
  # Ticks before the line is cleared. 20 ticks is one second. 0 leaves the line. Clamped to 0-600.
  ticks: 60

bossbar:
  enabled: false
  text: "<gold>Day {day}"
  # PINK, BLUE, RED, GREEN, YELLOW, PURPLE, WHITE
  color: YELLOW
  # SOLID, SEGMENTED_6, SEGMENTED_10, SEGMENTED_12, SEGMENTED_20
  style: SOLID
  # Seconds, clamped between 1 and 60.
  seconds: 5

gui:
  # Chest rows, from 1 to 6. The inventory size is this number times 9, 54 at most.
  rows: 6
  title: "<white>Calendar <gray>{date}"
  filler:
    material: GRAY_STAINED_GLASS_PANE
    # A blank name hides the tooltip.
    name: " "
  day:
    name: "<gold>Day {day}"
    lore:
      - "{status}"
    available-material: CHEST
    claimed-material: LIME_DYE
    missed-material: GRAY_DYE
    locked-material: BLACK_DYE
  status:
    open: "<green>Click to claim"
    claimed: "<gray>Claimed"
    missed: "<red>Missed"
    locked: "<gray>Not open yet"
  # slot -1 hides the item. Slots continue onto later pages. Nav is painted on top of a shared slot.
  decoration:
    - slot: 0
      material: RED_CANDLE
      name: ""
      lore: []
      custom-model-data: 0
    - slot: 4
      material: CLOCK
      name: "<white>{date}"
      lore: []
      custom-model-data: 0
    - slot: 8
      material: GREEN_CANDLE
      name: ""
      lore: []
      custom-model-data: 0
  nav:
    # Slot is inside one chest. -1 hides the button.
    previous:
      slot: 45
      material: ARROW
      name: "<gray>Previous"
      lore: []
    next:
      slot: 53
      material: ARROW
      name: "<gray>Next"
      lore: []
    close:
      slot: 49
      material: BARRIER
      name: "<red>Close"
      lore: []

# days.<n> is the door for that day of the month. n is 1-31.
# slot: index in the chest. -1 hides the door. Slot 54 is the first slot of the next page when the chest has 54 slots.
# Slots above 539 are hidden. material, name, and lore replace the available icon. Claimed, missed, and locked icons stay on gui.day.
# rewards is a list. Each entry rolls on its own.
# chance: 0-100, default 100. commands run as console. Tokens: {player} {uuid} {day} {date}
# items: material, amount (1-2304), name, lore, custom-model-data. 0 leaves the model unset.
# Item rewards that do not fit leave the day unclaimed. Command rewards are not measured against free slots.
# If every entry misses, the day is still claimed and messages.no-reward is sent.
# A day with no rewards is not claimed.
days:
  1:
    slot: 10
    rewards:
      - chance: 100
        commands: []
        items:
